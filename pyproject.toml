[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "void"
version = "0.1.0"
description = ""
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["textual", "textual-dev"]
authors = [{ name = "Nelson Urrutia", email = "nelurrutia15@gmail.com" }]

[project.urls]
Repository = "https://github.com/NelsonUrrutia/void"

[project.scripts]
void = "void.main:run"

[tool.hatch.build.targets.sdist]
include = ["/void", "/LICENSE", "/README.md", "/pyproject.toml"]

[tool.hatch.build.targets.wheel]
packages = ["void"]

[tool.basedpyright]
typeCheckingMode = "basic"
